[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "french-story-bot"
version = "0.1.0"
description = "A local-first French A1 daily lesson pipeline"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0,<3", "pydantic>=2.0,<3", "python-dotenv>=1.0,<2",
  "Markdown>=3.0,<4", "filelock>=3.0,<4", "langdetect==1.0.9", "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
french-bot = "french_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

